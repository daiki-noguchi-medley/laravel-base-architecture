# actionlint の設定。CI の «ワークフローの検査» ジョブ (.github/workflows/ci.yml) が読む。
#
# ⚠ ここに書いてよいのは «ツール側が追い付いていない» ものだけ。
#   指摘が邪魔だから消す、という使い方をすると検査そのものが形骸化する。
#   実際に直すべきものは直す。
#
# ⚠ 個別に見逃す指摘は、この設定ではなく該当行のコメントで理由と一緒に書く。
#   設定にまとめて書くと «なぜ無視してよいのか» が現場から離れて、後から判断できなくなる。
#
# 現時点で見逃している指摘は無い。足すときは paths の下に
#   .github/workflows/<file>:
#     ignore:
#       - '<actionlint のメッセージ>'   # なぜ無視してよいか
# の形で、理由のコメントを必ず添えること。
paths: {}
