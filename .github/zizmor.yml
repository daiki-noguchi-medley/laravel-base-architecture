# zizmor (ワークフローのセキュリティ監査) の設定。
# CI の «ワークフローの検査» ジョブ (.github/workflows/ci.yml) が読む。
#
# ここに書くのは «action をどう固定するか» の方針。
# 「サードパーティは SHA、GitHub / AWS / Docker の公式は tag」を暗黙の運用にしていると、
# 検査に掛けたときに公式まで «SHA にしろ» と言われて指摘が大量に出る
# (= 本当に外れている 1 件が埋まる)。方針そのものをここに書いて、
# 検査は «方針どおりか» だけを見るようにする。
#
# ⚠ ref-pin (tag のままでよい) にするのは «そこが乗っ取られたら CI どころではない» 提供元に
#   限る。それ以外は作者のアカウントが取られれば tag を同じ名前のまま差し替えられるので、
#   SHA で固定する (差し替えを «検知する» のではなく、差し替えても効かないようにする)。
# ⚠ 固定したまま更新が止まらないように Dependabot を入れてある (.github/dependabot.yml)。
#   SHA 固定の action も新しい SHA へ差し替える PR が出る。
#
# 個別に見逃す指摘は、この設定ではなく該当行の `# zizmor: ignore[...]` で理由と一緒に書く。
# 設定にまとめて書くと «なぜ無視してよいのか» が現場から離れて、後から判断できなくなる。
rules:
  unpinned-uses:
    config:
      policies:
        actions/*: ref-pin
        aws-actions/*: ref-pin
        docker/*: ref-pin
        '*': hash-pin
